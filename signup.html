<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — Junie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192x192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --paper: #FBFAF6; --paper-alt: #F1EFE7; --ink: #0A0A0A; --ink-soft: #55584E; --ink-faint: #8A8D80;
    --rule: rgba(10,10,10,0.14); --rule-soft: rgba(10,10,10,0.07);
    --signal: #F2664A; --signal-soft: rgba(242,102,74,0.12);
    --vital: #0F9E92; --vital-soft: rgba(15,158,146,0.12);
    --serif: 'Fraunces', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  h1{font-family:var(--serif); font-weight:600; margin:0;}
  p{margin:0;}

  header.nav{padding:24px 40px; border-bottom:1px solid var(--rule);}
  .logo{display:flex; align-items:center; gap:11px; font-family:var(--serif); font-weight:700; font-size:20px; text-decoration:none; color:var(--signal);}
  .logo-mark{width:30px; height:30px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .logo-mark svg{width:17px; height:17px;}
  .logo-mark{animation: heartbeat 1.7s ease-in-out infinite;}
  @keyframes heartbeat{0%,100%{transform:scale(1);} 12%{transform:scale(1.16);} 24%{transform:scale(1);} 36%{transform:scale(1.1);} 48%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .logo-mark{animation:none;} }

  .wrap{max-width:460px; margin:0 auto; padding:56px 24px 100px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--signal);
    text-align:center; margin-bottom:14px;
  }
  h1{font-size:30px; text-align:center; margin-bottom:8px;}
  .sub{color:var(--ink-soft); font-size:14.5px; text-align:center; margin-bottom:28px;}

  .type-toggle{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;}
  .type-btn{
    border:1px solid var(--rule); border-radius:8px; padding:14px 12px; background:var(--paper);
    cursor:pointer; text-align:left; font-family:var(--sans);
  }
  .type-btn.active{border-color:var(--signal); background:var(--signal-soft);}
  .type-btn strong{display:block; font-size:14px; margin-bottom:3px;}
  .type-btn span{font-size:12px; color:var(--ink-soft);}

  .plan-pill{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--rule); border-radius:8px; padding:12px 16px; margin-bottom:22px;
    font-family:var(--mono); font-size:13px; background:var(--paper-alt);
  }
  .plan-pill b{color:var(--signal);}
  .plan-pill a{color:var(--ink-soft); text-decoration:underline; font-family:var(--sans); font-size:12.5px;}

  .card{border:1px solid var(--rule); border-radius:10px; padding:30px; background:var(--paper);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px;}
  .field input{
    width:100%; border:1px solid var(--rule); border-radius:8px; padding:12px 14px;
    font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--paper-alt);
  }
  .field input:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:transparent;}
  .submit-btn{
    width:100%; border:none; border-radius:8px; background:var(--signal); color:#fff;
    font-family:var(--sans); font-weight:600; font-size:15.5px; padding:14px; cursor:pointer;
  }
  .submit-btn:hover{background:#C94A2E;}
  .fine{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); text-align:center; margin-top:16px;}
  .switch{text-align:center; margin-top:24px; font-size:14.5px; color:var(--ink-soft);}
  .switch a{color:var(--signal); text-decoration:underline; font-weight:600;}
  .note{font-family:var(--mono); font-size:12px; color:var(--ink-faint); text-align:center; margin-top:20px;}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">
    <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 3-9 2 5h5" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Junie
  </a>
</header>

<div class="wrap">
  <p class="eyebrow">Get started</p>
  <h1>Create your account</h1>
  <p class="sub">Free forever for one source. Upgrade any time.</p>

  <div class="type-toggle" id="typeToggle">
    <button type="button" class="type-btn active" data-type="individual">
      <strong>For myself</strong>
      <span>Connect your own sources and ask your own data questions.</span>
    </button>
    <button type="button" class="type-btn" data-type="caregiver">
      <strong>Caregiver or clinician</strong>
      <span>Monitor a loved one or patient who shares access with you.</span>
    </button>
  </div>

  <div class="plan-pill" id="planPill">
    <span>Plan: <b id="planName">Free</b></span>
    <a href="index.html#pricing">Change plan</a>
  </div>

  <div class="card">
    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="At least 8 characters" minlength="8">
      </div>
      <button type="submit" class="submit-btn" id="signupBtn">Create account →</button>
      <p class="fine" id="signupError" style="display:none; color:var(--signal); font-family:var(--sans); font-size:13px;"></p>
      <p class="fine">By continuing you agree to Junie's <a href="terms.html" style="color:var(--ink-soft);">Terms</a> and <a href="privacy.html" style="color:var(--ink-soft);">Privacy Policy</a>.</p>
    </form>
  </div>

  <p class="switch">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const planMap = { free: 'Free', pro: 'Pro' };
  const plan = planMap[params.get('plan')] || 'Free';
  document.getElementById('planName').textContent = plan;

  const prefillEmail = params.get('email');
  if (prefillEmail) {
    document.getElementById('email').value = prefillEmail;
    document.getElementById('name').focus();
  }

  let accountType = 'individual';
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      accountType = btn.getAttribute('data-type');
    });
  });

  const errorEl = document.getElementById('signupError');
  function showError(msg){
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    const btn = document.getElementById('signupBtn');
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      showError(typeof SUPABASE_INIT_ERROR !== 'undefined' ? SUPABASE_INIT_ERROR : 'Couldn\'t connect to our sign-in service. Please refresh and try again.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account…';

    // Safety net: if nothing resolves within 15s (dead network, blocked request,
    // unexpected error), don't leave the button stuck forever — reset and explain.
    let settled = false;
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      showError('This is taking too long — check your connection and try again. If it keeps happening, the issue may be on our end.');
      btn.disabled = false;
      btn.textContent = 'Create account →';
    }, 15000);

    try {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (settled) return; // timeout already fired, don't double-handle
      clearTimeout(timeoutId);

      if (error) {
        settled = true;
        showError(error.message);
        btn.disabled = false;
        btn.textContent = 'Create account →';
        return;
      }

      // Save the extra profile fields. If email confirmation is required,
      // there's no session yet, but the user row still exists in auth.users.
      if (data.user) {
        try {
          const { error: profileError } = await supabaseClient
            .from('profiles')
            .insert([{ user_id: data.user.id, name: name, account_type: accountType, plan: plan.toLowerCase() }]);
          if (profileError){
            console.warn('Profile insert failed — check that your "profiles" table has user_id, name, account_type, and plan columns:', profileError.message);
          }
        } catch (profileErr) {
          console.warn('Profile insert threw an unexpected error:', profileErr);
        }
      }

      settled = true;

      if (!data.session) {
        // Email confirmation is on — no session until they click the link in their inbox.
        // Turn the button into a working "resend" action instead of a dead end.
        showError('Almost there — check ' + email + ' for a confirmation link before signing in. Didn\'t get it? You can resend it below.');
        startResendCooldown(btn, email);
        return;
      }
    } catch (unexpectedError) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      console.error('Signup failed with an unexpected error:', unexpectedError);
      showError('Something went wrong creating your account: ' + (unexpectedError && unexpectedError.message ? unexpectedError.message : 'unknown error') + '. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Create account →';
      return;
    }

    window.location.href = accountType === 'caregiver' ? 'caregiver-portal.html' : 'dashboard.html';
  });

  function startResendCooldown(btn, email){
    btn.type = 'button'; // decouple from form submit once we're in "resend" mode
    let seconds = 30;
    btn.disabled = true;
    btn.textContent = `Resend in ${seconds}s`;
    const timer = setInterval(() => {
      seconds--;
      if (seconds <= 0){
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = 'Resend confirmation email →';
        btn.onclick = async (e) => {
          e.preventDefault();
          btn.disabled = true;
          btn.textContent = 'Resending…';
          const { error } = await supabaseClient.auth.resend({ type: 'signup', email });
          if (error) {
            showError(error.message);
            btn.disabled = false;
            btn.textContent = 'Resend confirmation email →';
          } else {
            showError('Sent again — check ' + email + '.');
            startResendCooldown(btn, email);
          }
        };
      } else {
        btn.textContent = `Resend in ${seconds}s`;
      }
    }, 1000);
  }
</script>

</body>
</html>
