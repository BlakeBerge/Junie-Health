<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authorize — Junie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<style>
  :root{
    --paper: #FFFFFF; --paper-alt: #F6F5F2; --ink: #0A0A0A; --ink-soft: #55584E; --ink-faint: #8A8D80;
    --rule: rgba(10,10,10,0.14); --rule-soft: rgba(10,10,10,0.07);
    --signal: #F2664A; --signal-soft: rgba(242,102,74,0.12);
    --vital: #0F9E92; --vital-soft: rgba(15,158,146,0.12);
    --down: #9C2B44; --down-soft: rgba(156,43,68,0.1);
    --serif: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    max-width:440px; width:100%; border:1px solid var(--rule); border-radius:16px; padding:32px;
    background:var(--paper); box-shadow:0 1px 2px rgba(10,10,10,0.04), 0 8px 24px -12px rgba(10,10,10,0.1);
  }
  .logo{display:flex; align-items:center; gap:10px; font-family:var(--serif); font-weight:700; font-size:18px; color:var(--signal); margin-bottom:24px;}
  .logo-mark{width:28px; height:28px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .logo-mark svg{width:16px; height:16px;}
  h1{font-family:var(--serif); font-size:22px; margin:0 0 10px; letter-spacing:-0.01em;}
  p{margin:0 0 16px; color:var(--ink-soft); font-size:14.5px;}
  .client-name{font-weight:700; color:var(--ink);}
  .scope-box{
    background:var(--paper-alt); border-radius:10px; padding:16px 18px; margin-bottom:20px;
  }
  .scope-box .label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:8px;}
  .scope-box ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-soft);}
  .scope-box li{margin-bottom:4px;}
  .actions{display:flex; gap:10px;}
  .btn{
    flex:1; font-family:var(--sans); font-weight:600; font-size:14px; padding:12px 18px; border-radius:9px;
    border:1px solid var(--ink); background:none; color:var(--ink); cursor:pointer; text-align:center;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn:hover{background:var(--paper-alt);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .error-box{
    background:var(--down-soft); border:1px solid var(--down); border-radius:10px; padding:14px 16px;
    font-size:13.5px; color:var(--ink);
  }
  .revoke-note{font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:16px; margin-bottom:0;}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="logo">
    <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 3-9 2 5h5" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Junie
  </div>
  <div id="content"><p>Loading…</p></div>
</div>

<script>
  const content = document.getElementById('content');
  function showError(msg){
    content.innerHTML = `<div class="error-box">${msg}</div>`;
  }

  // If nothing below has replaced this within 10s, something hung silently
  // (e.g. a network call that never resolved) instead of throwing -- surface
  // that instead of leaving "Loading…" up forever with no way to diagnose it.
  const watchdog = setTimeout(() => {
    showError('This is taking too long — something hung without an error. DEBUG: params=' + window.location.search);
  }, 10000);

  (async () => {
    try {
      const params = new URLSearchParams(window.location.search);
      const responseType = params.get('response_type');
      const clientId = params.get('client_id');
      const redirectUri = params.get('redirect_uri');
      const codeChallenge = params.get('code_challenge');
      const codeChallengeMethod = params.get('code_challenge_method') || 'S256';
      const state = params.get('state') || '';

      if (responseType !== 'code' || !clientId || !redirectUri || !codeChallenge){
        clearTimeout(watchdog);
        showError('This authorization request is missing required parameters. DEBUG: params=' + window.location.search);
        return;
      }
      if (codeChallengeMethod !== 'S256'){
        clearTimeout(watchdog);
        showError('This app requested an unsupported PKCE method. Junie only supports S256.');
        return;
      }

      if (typeof supabaseClient === 'undefined' || !supabaseClient){
        clearTimeout(watchdog);
        showError('Could not connect to Junie\'s sign-in service (supabaseClient never initialized) -- likely a script blocked from loading. Try reloading.');
        return;
      }

      const session = await requireAuth();
      if (!session){ clearTimeout(watchdog); return; } // requireAuth already redirected to login.html?next=<this URL>

      const { data: client, error: clientErr } = await supabaseClient
        .from('oauth_clients')
        .select('client_id, client_name, redirect_uris')
        .eq('client_id', clientId)
        .maybeSingle();

      clearTimeout(watchdog);

      if (clientErr){
        showError('Could not look up this app: ' + clientErr.message);
        return;
      }
      if (!client){
        showError('Unknown app -- this connector hasn\'t registered with Junie yet. DEBUG: client_id=' + clientId);
        return;
      }
      if (!client.redirect_uris.includes(redirectUri)){
        showError('This app\'s redirect address doesn\'t match what it registered with. For your safety, Junie won\'t continue. DEBUG: got=' + redirectUri + ' registered=' + JSON.stringify(client.redirect_uris));
        return;
      }

      content.innerHTML = `
      <h1><span class="client-name">${client.client_name}</span> wants to access your Junie data</h1>
      <p>Signed in as ${session.user.email}.</p>
      <div class="scope-box">
        <div class="label">This grants read-only access to</div>
        <ul>
          <li>Which sources you've connected and when they last synced</li>
          <li>Your health metrics (sleep, recovery, activity, etc.)</li>
          <li>Your computed health score</li>
        </ul>
      </div>
      <div class="actions">
        <button class="btn" id="denyBtn">Deny</button>
        <button class="btn btn-primary" id="allowBtn">Allow →</button>
      </div>
      <p class="revoke-note">You can revoke this any time from AI &amp; Agents in your account.</p>
    `;

    document.getElementById('denyBtn').addEventListener('click', () => {
      const target = new URL(redirectUri);
      target.searchParams.set('error', 'access_denied');
      if (state) target.searchParams.set('state', state);
      window.location.href = target.toString();
    });

    document.getElementById('allowBtn').addEventListener('click', async () => {
      const allowBtn = document.getElementById('allowBtn');
      allowBtn.disabled = true;
      allowBtn.textContent = 'Connecting…';

      try {
        const codeBytes = crypto.getRandomValues(new Uint8Array(24));
        const code = 'ac_' + [...codeBytes].map(b => b.toString(16).padStart(2,'0')).join('');
        const expiresAt = new Date(Date.now() + 5 * 60 * 1000).toISOString();

        const { error: insertErr } = await supabaseClient.from('oauth_auth_codes').insert([{
          code, client_id: clientId, user_id: session.user.id, redirect_uri: redirectUri,
          code_challenge: codeChallenge, code_challenge_method: codeChallengeMethod, expires_at: expiresAt,
        }]);

        if (insertErr){
          showError('Could not start the connection: ' + insertErr.message);
          return;
        }

        const target = new URL(redirectUri);
        target.searchParams.set('code', code);
        if (state) target.searchParams.set('state', state);
        window.location.href = target.toString();
      } catch (err) {
        showError('Unexpected error approving the connection: ' + (err instanceof Error ? err.message : String(err)));
      }
    });
    } catch (err) {
      clearTimeout(watchdog);
      showError('Unexpected error: ' + (err instanceof Error ? err.message : String(err)));
    }
  })();
</script>

</body>
</html>
