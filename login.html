<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Junie</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192x192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --paper: #FFFFFF; --paper-alt: #F6F5F2; --ink: #0A0A0A; --ink-soft: #55584E; --ink-faint: #8A8D80;
    --rule: rgba(10,10,10,0.14); --rule-soft: rgba(10,10,10,0.07);
    --signal: #F2664A; --signal-soft: rgba(242,102,74,0.12);
    --vital: #0F9E92; --vital-soft: rgba(15,158,146,0.12);
    --serif: 'Fraunces', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  h1{font-family:var(--serif); font-weight:600; margin:0;}
  p{margin:0;}

  header.nav{padding:24px 40px; border-bottom:1px solid var(--rule);}
  .logo{display:flex; align-items:center; gap:11px; font-family:var(--serif); font-weight:700; font-size:20px; text-decoration:none; color:var(--signal);}
  .logo-mark{width:30px; height:30px; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .logo-mark svg{width:17px; height:17px;}
  .logo-mark{animation: heartbeat 1.7s ease-in-out infinite;}
  @keyframes heartbeat{0%,100%{transform:scale(1);} 12%{transform:scale(1.16);} 24%{transform:scale(1);} 36%{transform:scale(1.1);} 48%{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .logo-mark{animation:none;} }

  .wrap{max-width:420px; margin:0 auto; padding:64px 24px 100px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--signal);
    text-align:center; margin-bottom:14px;
  }
  h1{font-size:30px; text-align:center; margin-bottom:8px;}
  .sub{color:var(--ink-soft); font-size:14.5px; text-align:center; margin-bottom:36px;}

  .card{border:1px solid var(--rule); border-radius:10px; padding:30px; background:var(--paper);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:6px;}
  .field input{
    width:100%; border:1px solid var(--rule); border-radius:8px; padding:12px 14px;
    font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--paper-alt);
  }
  .field input:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:transparent;}
  .row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:13px;}
  .row-between a{color:var(--signal); text-decoration:underline;}
  .submit-btn{
    width:100%; border:none; border-radius:8px; background:var(--signal); color:#fff;
    font-family:var(--sans); font-weight:600; font-size:15.5px; padding:14px; cursor:pointer;
  }
  .submit-btn:hover{background:#C94A2E;}
  .divider{display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--ink-faint); font-family:var(--mono); font-size:11px; text-transform:uppercase;}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--rule);}
  .portal-link{
    display:block; text-align:center; font-family:var(--mono); font-size:13px; color:var(--vital);
    border:1px solid var(--vital); background:var(--vital-soft); border-radius:8px; padding:12px; text-decoration:none;
  }
  .portal-link:hover{background:var(--vital); color:#fff;}
  .note{font-family:var(--mono); font-size:12px; color:var(--ink-faint); text-align:center; margin-top:20px;}
  .switch{text-align:center; margin-top:24px; font-size:14.5px; color:var(--ink-soft);}
  .switch a{color:var(--signal); text-decoration:underline; font-weight:600;}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">
    <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 3-9 2 5h5" stroke="var(--signal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Junie
  </a>
</header>

<div class="wrap">
  <p class="eyebrow">Welcome back</p>
  <h1>Sign in</h1>
  <p class="sub">Ask your data anything — pick up right where you left off.</p>

  <div class="card">
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div class="row-between">
        <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft);"><input type="checkbox" style="width:auto;"> Stay signed in</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">Sign in →</button>
      <p class="fine" id="loginError" style="display:none; color:var(--signal); font-family:var(--sans); font-size:13px; text-align:center; margin-top:12px;"></p>
    </form>

    <div class="divider">or</div>

    <a href="caregiver-portal.html" class="portal-link">I'm a caregiver or clinician — go to the portal →</a>
  </div>

  <p class="switch">New to Junie? <a href="signup.html">Create an account</a></p>
</div>

<script>
  const errorEl = document.getElementById('loginError');
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.style.display = 'none';
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      errorEl.textContent = typeof SUPABASE_INIT_ERROR !== 'undefined' ? SUPABASE_INIT_ERROR : 'Couldn\'t connect to our sign-in service. Please refresh and try again.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = error.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in →';
      return;
    }

    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = next ? decodeURIComponent(next) : 'dashboard.html';
  });
</script>

</body>
</html>
